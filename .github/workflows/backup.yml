# Static backup of the live site. Run it from GitHub: Actions > "Update static backup" > Run workflow.
name: Update static backup

on:
  workflow_dispatch:
    inputs:
      source:
        description: Site to copy
        default: https://dannopeters.ca
        required: true

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Copy the live site
        run: |
          HOST=$(echo "${{ inputs.source }}" | sed -E 's#https?://##; s#/.*##')
          wget --mirror --page-requisites --adjust-extension --convert-links --no-parent \
               --restrict-file-names=windows --no-host-directories --directory-prefix=mirror \
               --domains="$HOST" -e robots=off --wait=0.3 --tries=3 --timeout=30 \
               --reject-regex='wp-admin|wp-login|wp-json|xmlrpc|/feed/|\?s=|replytocom|/embed/|\?p=|\?page_id=' \
               "${{ inputs.source }}/" || true
          test -f mirror/index.html

      - name: Add backup banner
        run: BACKUP_DATE="$(date -u '+%B %-d, %Y')" python3 .backup/make_static.py mirror "${{ inputs.source }}"

      - name: Replace the site, keeping the domain and backup tools
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .backup ! -name mirror ! -name CNAME \
               ! -name 'google*.html' -exec rm -rf {} +
          cp -a mirror/. .
          rm -rf mirror
          touch .nojekyll

      - name: Publish
        run: |
          git config user.name "Static backup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || git commit -m "Static backup of ${{ inputs.source }} ($(date -u +%F))"
          git push
